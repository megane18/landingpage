<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Mégane Alexis</title>

  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/android-chrome-192x192.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#111113" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#111113; --fg:#EDEDEF; --muted:#8B8B94; --faint:#5C5C66; --line:#232328; --card:#17171A;
      --R:#E06C75; --B:#7896F2; --G:#5FBF98; --Y:#EBCB6B; --O:#E8955A;
      --mono:"Geist Mono",ui-monospace,Menlo,monospace;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:"Geist",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:var(--fg)}
    :focus-visible{outline:2px solid var(--Y);outline-offset:3px;border-radius:4px}

    /* scanlines + noise */
    body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
      background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
    #noise{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;opacity:.03;image-rendering:pixelated}

    .wrap{position:relative;z-index:4;min-height:100svh;display:grid;place-items:center;
      padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:48px}
    .box{max-width:40rem;width:100%}

    .code{font-family:var(--mono);font-size:12.5px;color:var(--faint);margin:0 0 22px;display:flex;gap:10px;align-items:center}
    .code .dot{width:8px;height:8px;border-radius:2px;background:var(--R);animation:blink 1.1s steps(2) infinite}
    @keyframes blink{50%{opacity:.15}}

    /* the glitching name */
    h1{position:relative;margin:0 0 18px;font-weight:700;font-size:clamp(46px,11vw,104px);line-height:.95;letter-spacing:-.04em}
    h1 .t{position:relative;display:inline-block}
    h1 .t::before,h1 .t::after{content:attr(data-text);position:absolute;inset:0;pointer-events:none}
    h1 .t::before{color:var(--R);mix-blend-mode:screen;animation:sliceA 3.2s infinite steps(1)}
    h1 .t::after{color:var(--B);mix-blend-mode:screen;animation:sliceB 2.7s infinite steps(1)}
    @keyframes sliceA{
      0%,100%{clip-path:inset(0 0 100% 0);transform:none}
      8%{clip-path:inset(12% 0 70% 0);transform:translate(-6px,0)}
      10%{clip-path:inset(55% 0 22% 0);transform:translate(5px,0)}
      12%{clip-path:inset(0 0 100% 0)}
      61%{clip-path:inset(78% 0 6% 0);transform:translate(-9px,0)}
      63%{clip-path:inset(0 0 100% 0)}
    }
    @keyframes sliceB{
      0%,100%{clip-path:inset(0 0 100% 0);transform:none}
      20%{clip-path:inset(40% 0 44% 0);transform:translate(7px,0)}
      22%{clip-path:inset(4% 0 82% 0);transform:translate(-4px,0)}
      24%{clip-path:inset(0 0 100% 0)}
      77%{clip-path:inset(62% 0 18% 0);transform:translate(8px,0)}
      79%{clip-path:inset(0 0 100% 0)}
    }
    body.burst h1 .t{animation:shake .25s steps(2) 2}
    @keyframes shake{0%{transform:translate(0)}50%{transform:translate(3px,-1px) skewX(-6deg)}100%{transform:translate(-2px,1px)}}
    body.burst .wrap{filter:hue-rotate(40deg) contrast(1.2)}

    .msg{font-size:clamp(18px,2.6vw,22px);line-height:1.5;margin:0 0 8px;max-width:32rem}
    .sub{color:var(--muted);font-size:16px;line-height:1.65;margin:0 0 30px;max-width:32rem}

    /* tiny cube progress */
    .build{display:flex;align-items:center;gap:14px;margin:0 0 32px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
    .mini{display:grid;grid-template-columns:repeat(3,12px);gap:3px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:6px}
    .mini i{width:12px;height:12px;border-radius:2px;background:var(--line);transition:background .3s}

    .links{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .btn{display:inline-block;text-decoration:none;font-weight:500;font-size:15px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);box-shadow:0 3px 0 var(--line);transition:transform .2s}
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(3px);box-shadow:none}
    .btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 3px 0 #6a6a72}
    .foot{margin-top:56px;font-family:var(--mono);font-size:12px;color:var(--faint)}

    @media (prefers-reduced-motion: reduce){
      h1 .t::before,h1 .t::after,.code .dot{animation:none}
      h1 .t::before{clip-path:inset(60% 0 25% 0);transform:translate(-3px,0)}
      h1 .t::after{clip-path:inset(20% 0 65% 0);transform:translate(3px,0)}
      #noise{display:none}
    }
  </style>
</head>
<body>
  <canvas id="noise" aria-hidden="true"></canvas>
  <main class="wrap">
    <div class="box">
      <p class="code"><span class="dot"></span><span id="err">ERR 503 · site under reconstruction</span></p>
      <h1><span class="t" id="name" data-text="Mégane Alexis">Mégane Alexis</span></h1>
      <p class="msg">Something broke. On purpose.</p>
      <p class="sub">I took the old site down and I'm rebuilding it from scratch. The new one is almost ready.</p>
      <div class="build" aria-hidden="true"><span class="mini" id="mini"></span><span id="pct">rebuilding</span></div>
      <div class="links">
        <a class="btn main" href="mailto:hello@meganealexis.com">Get in touch</a>
        <a class="btn" href="https://github.com/megane18" target="_blank" rel="noreferrer">GitHub</a>
        <a class="btn" href="https://linkedin.com/in/megane-alexis" target="_blank" rel="noreferrer">LinkedIn</a>
        <a class="btn" href="https://signbridge.ai" target="_blank" rel="noreferrer">SignBridge</a>
      </div>
      <p class="foot">© 2026 Mégane Alexis</p>
    </div>
  </main>

  <script>
  (function(){
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // mini cube: stickers light up one by one, then reset
    var colors = ['--G','--Y','--O','--R','--B','--G','--R','--B','--Y'];
    var mini = document.getElementById('mini'), cells = [];
    for (var i = 0; i < 9; i++) { var c = document.createElement('i'); mini.appendChild(c); cells.push(c); }
    var order = [0,1,2,5,8,7,6,3,4], step = 0;
    function fill(){
      if (step > 9) { cells.forEach(function(c){ c.style.background=''; }); step = 0; }
      else if (step < 9) { var k = order[step]; cells[k].style.background = k===4 ? 'var(--fg)' : 'var(' + colors[k] + ')'; }
      step++;
    }
    if (reduce) { for (var s = 0; s < 7; s++) fill(); } else { setInterval(fill, 450); }

    if (reduce) return;

    // name scrambles now and then
    var el = document.getElementById('name'), real = el.dataset.text;
    var junk = '!<>-_\\/[]{}=+*^?#01';
    function scramble(){
      var n = 0, max = 8;
      var t = setInterval(function(){
        var out = '';
        for (var i = 0; i < real.length; i++) {
          out += (real[i] !== ' ' && Math.random() < .35 && n < max - 1) ? junk[Math.floor(Math.random()*junk.length)] : real[i];
        }
        el.textContent = out; el.dataset.text = out;
        if (++n >= max) { clearInterval(t); el.textContent = real; el.dataset.text = real; }
      }, 55);
      document.body.classList.add('burst');
      setTimeout(function(){ document.body.classList.remove('burst'); }, 260);
    }
    (function loop(){ setTimeout(function(){ scramble(); loop(); }, 2600 + Math.random()*3400); })();

    // error line flickers between messages
    var msgs = ['ERR 503 · site under reconstruction','rebuilding meganealexis.com','signal lost · reconnecting','ERR 503 · site under reconstruction'];
    var err = document.getElementById('err'), m = 0;
    setInterval(function(){ m = (m+1) % msgs.length; err.textContent = msgs[m]; }, 3000);

    // tab title glitch
    var base = 'Mégane Alexis', alt = ['M3g@ne Al3xis','Mégane_Alexis','rebuilding...','Mégane Alexis'];
    setInterval(function(){
      document.title = alt[Math.floor(Math.random()*alt.length)];
      setTimeout(function(){ document.title = base; }, 400);
    }, 4000);

    // noise
    var cv = document.getElementById('noise'), ctx = cv.getContext('2d');
    cv.width = 160; cv.height = 90;
    var img = ctx.createImageData(cv.width, cv.height);
    (function draw(){
      for (var i = 0; i < img.data.length; i += 4) { var v = Math.random()*255|0; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255; }
      ctx.putImageData(img, 0, 0);
      setTimeout(function(){ requestAnimationFrame(draw); }, 70);
    })();
  })();
  </script>
</body>
</html>
